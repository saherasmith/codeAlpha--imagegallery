<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Responsive Image Gallery</h1>

    <div class="filter-buttons">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('cars')">Cars</button>
        <button onclick="filterImages('animals')">Animals</button>
    </div>

    <div class="gallery">

        <div class="image nature">
            <img src="images/nature1.jpg" alt="Nature">
        </div>

        <div class="image nature">
            <img src="images/nature2.jpg" alt="Nature">
        </div>

        <div class="image greenary">
            <img src="images/greenary.jpg" alt="Greenary">
        </div>

        <div class="image desert">
            <img src="images/desert.jpg" alt="Desert">
        </div>
        <div class="image animals">
            <img src="images/animal
            .jpg" alt="Animals">
        </div>
    </div>

    <!-- Lightbox -->

    <div class="lightbox">

        <span class="close">&times;</span>

        <button class="prev">&#10094;</button>

        <img class="lightbox-img" src="" alt="">

        <button class="next">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
